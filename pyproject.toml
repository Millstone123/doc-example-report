[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "doc-example-report"
version = "1.0.0"
description = "Deterministic quality reports for Markdown release notes"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
doc-example-report = "doc_example_report.cli:main"

[tool.setuptools.packages.find]
include = ["doc_example_report*"]
